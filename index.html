<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>For SNEH 🎀</title>
  <link rel="icon" type="image/png" href="assets/teddy.png" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;1,500&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<svg width="0" height="0" style="position: absolute">
         <defs>
            <radialGradient id="fur" cx=".35" cy=".3" r=".9">
               <stop offset="0" stop-color="#ffd8e9" />
               <stop offset=".55" stop-color="#ff9dc6" />
               <stop offset="1" stop-color="#e9609f" />
            </radialGradient>
            <linearGradient id="cp" x1="0" y1="0" x2="0" y2="1">
               <stop stop-color="#ffc4de" />
               <stop offset="1" stop-color="#ff8fbd" />
            </linearGradient>
            <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1">
               <stop stop-color="#ead9ff" />
               <stop offset="1" stop-color="#c8b4ff" />
            </linearGradient>
            <linearGradient id="cc" x1="0" y1="0" x2="0" y2="1">
               <stop stop-color="#fffaf2" />
               <stop offset="1" stop-color="#ffe8d6" />
            </linearGradient>
         </defs>
      </svg>
      <div id="app"></div>
      <div
         id="mu"
         style="
            position: fixed;
            top: calc(env(safe-area-inset-top) + 10px);
            right: 12px;
            z-index: 60;
            display: none;
         "
      >
         <button class="pill" id="mub">♪ Music</button>
      </div>
      <div id="veil"></div>
      <div id="fx"></div>
      <div id="ts"></div>
      <div id="lb">
         <button class="pill" id="lbx">✕</button>
         <div id="lbc"></div>
         <div id="lbt"></div>
         <div id="lbm"></div>
         <button class="lbn" id="lbp" style="left: 8px">‹</button
         ><button class="lbn" id="lbn" style="right: 8px">›</button>
      </div>
      <div id="ld">
         <div class="tt" id="ldt"></div>
         <p style="font: 600 1.6rem var(--hw)" id="ldp"></p>
         <div class="bar"><i></i></div>
      </div>
  <script src="js/assets.js"></script>
  <script src="js/config.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/content.js"></script>
  <script src="js/gift.js"></script>
  <script src="js/easter-eggs.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
